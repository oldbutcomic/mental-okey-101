services:
  - type: web
    name: mental-okey-101
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile && VITE_BASE_PATH=/ corepack pnpm build
    startCommand: corepack pnpm run server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: ENABLE_TEST_PANEL
        value: "false"
      - key: CLIENT_ORIGIN
        value: "https://mental-okey-101.onrender.com,https://oldbutcomic.github.io"
      - key: DATABASE_URL
        sync: false
      - key: BETA_INVITE_CODE
        sync: false
